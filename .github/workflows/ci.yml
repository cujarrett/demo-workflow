name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Lint
        run: go vet ./...

  build-and-push:
    needs: test
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    # Sandboxes pull :latest, so a push to main reaches the next sandbox with no deploy step.
    uses: cujarrett/homelab/.github/workflows/build-image.yml@main
    with:
      image: ghcr.io/cujarrett/demo-workflow
      tags: |
        ghcr.io/cujarrett/demo-workflow:latest
        ghcr.io/cujarrett/demo-workflow:sha-${{ github.sha }}
      cache-scope: demo-workflow
